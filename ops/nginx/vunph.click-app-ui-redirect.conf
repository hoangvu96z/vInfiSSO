# Applied inside the HTTPS `server` block (`server_name vunph.click www.vunph.click;`)
# of `/etc/nginx/sites-available/vunph.click`.
#
# Purpose:
# - Redirect only the frontend app UI routes (/kinhdich, /tarot, /tuvi, /talk, /note, /spiritnow)
#   to https://vunph.id.vn while preserving the full path and query string ($request_uri).
# - Use 302 (Found) to keep the redirect immediately reversible without permanent browser caching.
# - Leave /sso, /admin, /health, API routes, and the separate sso.vunph.click vhost untouched.

# Redirect app UI paths to https://vunph.id.vn (preserve path and query string)
location ~ ^/(kinhdich|tarot|tuvi|talk|note|spiritnow)(/|$) {
    return 302 https://vunph.id.vn$request_uri;
}
