name: Deploy vInfiSSO

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vinfi-sso-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy → sso.vunph.click
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js setup ────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install & Build ───────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix admin-ui

      - name: Build NestJS & Admin UI
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify compiled runtime and migration entry points
        run: >-
          test -f dist/src/main.js &&
          test -f dist/scripts/encrypt-readings.js &&
          test -f dist/scripts/deploy-streak-migration.js &&
          test -f dist/scripts/deploy-journal-migration.js &&
          test -f dist/src/database/migrations/1792886400000-UserStreaks.js &&
          test -f dist/src/database/migrations/1792800000000-SpiritualJournal.js

      # Check the runtime used by the existing app before copying any artifacts.
      - name: Preflight VPS Node.js runtime
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '43.128.116.69' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -eu
            NODE_BIN="$(command -v node || true)"
            APP_PID="$(pm2 pid vinfi-sso 2>/dev/null | head -n 1 || true)"
            if [ -n "$APP_PID" ] && [ -x "/proc/$APP_PID/exe" ]; then
              NODE_BIN="$(readlink -f "/proc/$APP_PID/exe")"
            fi
            if [ -z "$NODE_BIN" ]; then
              echo "Preflight failed: Node.js is not available on the VPS."
              exit 1
            fi
            NODE_VERSION="$("$NODE_BIN" -p 'process.versions.node')"
            if ! "$NODE_BIN" -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 13)) process.exit(1)'; then
              echo "Preflight failed: vInfiSSO requires Node.js >= 22.13.0; VPS has $NODE_VERSION."
              exit 1
            fi
            echo "Preflight passed: VPS app runtime is Node.js $NODE_VERSION."

      # The existing app stays live while this fresh encrypted offsite copy is
      # created and verified. A local-only or stale backup stops the deploy.
      - name: Create and verify encrypted offsite backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '43.128.116.69' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -eu
            if ! BACKUP_OUTPUT="$(sudo -n /usr/local/sbin/backup-vinfi.sh 2>&1)"; then
              echo "Backup gate failed: backup command exited unsuccessfully; stopping deployment."
              exit 1
            fi
            if ! printf '%s\n' "$BACKUP_OUTPUT" | grep -Eq '^Backup complete: run_id=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{6}Z status=offsite_ok offsite=verified$'; then
              echo "Backup gate failed: verified offsite success marker is missing; stopping deployment."
              exit 1
            fi
            unset BACKUP_OUTPUT
            echo "Fresh encrypted backup and offsite verification passed."

      # ── 4. Upload dist & admin-ui/dist lên server qua SSH/SCP ───────────────
      - name: Copy build artifacts to VPS server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST || '43.128.116.69' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: 'dist/**,admin-ui/dist/**,package.json,package-lock.json'
          target: '/var/www/sso.vunph.click'

      # ── 5. Apply the backup-gated streak migration, verify Journal, then restart ──
      - name: Apply Journal migration and restart PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '43.128.116.69' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /var/www/sso.vunph.click
            export NODE_ENV=production
            echo "📦 Cài đặt production dependencies nếu có thay đổi..."
            npm install --omit=dev --no-audit --no-fund
            APP_SCRIPT="$PWD/dist/src/main.js"
            if [ ! -f "$APP_SCRIPT" ]; then
              echo "Deploy failed: compiled entry point is missing: $APP_SCRIPT"
              exit 1
            fi
            if [ ! -f dist/scripts/deploy-journal-migration.js ]; then
              echo "Deploy failed: guarded Journal migration runner is missing."
              exit 1
            fi
            if [ ! -f dist/scripts/deploy-streak-migration.js ]; then
              echo "Deploy failed: guarded streak migration runner is missing."
              exit 1
            fi
            NODE_BIN="$(command -v node || true)"
            APP_PID="$(pm2 pid vinfi-sso 2>/dev/null | head -n 1 || true)"
            if [ -n "$APP_PID" ] && [ -x "/proc/$APP_PID/exe" ]; then
              NODE_BIN="$(readlink -f "/proc/$APP_PID/exe")"
            fi
            if [ -z "$NODE_BIN" ]; then
              echo "Deploy failed: Node.js is not available to run the guarded migration."
              exit 1
            fi
            echo "Running guarded streak migration before PM2 restart..."
            "$NODE_BIN" dist/scripts/deploy-streak-migration.js
            echo "Verifying guarded Journal migration before PM2 restart..."
            "$NODE_BIN" dist/scripts/deploy-journal-migration.js
            echo "🔄 Restart PM2 vinfi-sso from $APP_SCRIPT..."
            if pm2 describe vinfi-sso > /dev/null 2>&1; then
              CURRENT_SCRIPT="$(pm2 jlist | node -e 'let s=""; process.stdin.on("data", (x) => s += x).on("end", () => { const p = JSON.parse(s).find((item) => item.name === "vinfi-sso"); process.stdout.write(p?.pm2_env?.pm_exec_path || ""); });')"
              if [ "$CURRENT_SCRIPT" = "$APP_SCRIPT" ]; then
                pm2 restart vinfi-sso --update-env
              else
                pm2 delete vinfi-sso
                if ! pm2 start "$APP_SCRIPT" --name vinfi-sso --env production --max-memory-restart 300M; then
                  if [ -f dist/main.js ]; then
                    pm2 start dist/main.js --name vinfi-sso --env production --max-memory-restart 300M
                    pm2 save
                  fi
                  exit 1
                fi
                pm2 save
              fi
            else
              pm2 start "$APP_SCRIPT" --name vinfi-sso --env production --max-memory-restart 300M
              pm2 save
            fi
            echo "✅ Deploy thành công!"
            pm2 show vinfi-sso | grep -E "status|pid|uptime|script path"

      # ── 6. Health check ──────────────────────────────────────────────────────
      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sso.vunph.click/ui/sso || echo "000")
          echo "SSO Service Health: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
          echo "✅ SSO Service đang hoạt động tốt!"
