name: Deploy vInfiSSO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy → sso.vunph.click
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js setup ────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install & Build ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build NestJS
        run: npm run build
        env:
          NODE_ENV: production

      # ── 4. Upload dist lên server qua SSH/SCP ───────────────────────────────
      - name: Copy build artifacts to VPS server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST || '43.128.116.69' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dist/*,package.json,package-lock.json"
          target: "/var/www/sso.vunph.click"

      # ── 5. Restart PM2 Service ──────────────────────────────────────────────
      - name: Restart PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '43.128.116.69' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /var/www/sso.vunph.click
            echo "📦 Cài đặt production dependencies nếu có thay đổi..."
            npm install --omit=dev --no-audit --no-fund
            echo "🔄 Restart PM2 vinfi-sso..."
            if pm2 describe vinfi-sso > /dev/null 2>&1; then
              pm2 restart vinfi-sso --update-env
            else
              pm2 start dist/main.js --name vinfi-sso --env production --max-memory-restart 300M
              pm2 save
            fi
            echo "✅ Deploy thành công!"
            pm2 show vinfi-sso | grep -E "status|pid|uptime"

      # ── 6. Health check ──────────────────────────────────────────────────────
      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sso.vunph.click/ui/sso || echo "000")
          echo "SSO Service Health: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ SSO Service đang hoạt động tốt!" || echo "⚠️ Cảnh báo: HTTP status $STATUS"
