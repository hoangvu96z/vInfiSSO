name: Install approved VPS SSH public key

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-current-ssh-key.yml

permissions:
  contents: read

jobs:
  install-key:
    runs-on: ubuntu-latest
    steps:
      - name: Add the approved public key to ubuntu authorized_keys
        uses: appleboy/ssh-action@v1.0.3
        env:
          CURRENT_SSH_PUBLIC_KEY: "ssh-rsa "
        with:
          host: ${{ secrets.SSH_HOST || '43.128.116.69' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: CURRENT_SSH_PUBLIC_KEY
          script: |
            set -eu
            umask 077
            install -d -m 0700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 0600 "$HOME/.ssh/authorized_keys"
            if ! grep -Fqx -- "$CURRENT_SSH_PUBLIC_KEY" "$HOME/.ssh/authorized_keys"; then
              printf '%s\n' "$CURRENT_SSH_PUBLIC_KEY" >> "$HOME/.ssh/authorized_keys"
              chmod 0600 "$HOME/.ssh/authorized_keys"
            fi
            echo 'Approved public key is installed.'
