name: CI

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install admin UI dependencies
        run: npm ci --prefix admin-ui

      - name: Type check backend and specs
        run: npx tsc --noEmit

      - name: Build backend and admin UI
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test backend
        run: npm test -- --runInBand

      - name: Test admin UI
        run: npm test --prefix admin-ui

      - name: Lint backend
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Lint admin UI
        run: npm run lint --prefix admin-ui
