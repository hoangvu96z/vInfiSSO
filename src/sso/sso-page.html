<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vInfi SSO — Authentication Portal</title>
  <link rel="icon" type="image/svg+xml" href="/vlnfi_sso_favicon_option_1.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root[data-theme="dark"] {
      --bg-page: #090d16;
      --bg-card: #131c31;
      --bg-input: #1a243d;
      --border-color: #1e293b;
      --border-focus: #6366f1;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft: rgba(99, 102, 241, 0.15);
      --google-bg: #1e293b;
      --facebook-bg: #1877F2;
      --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    :root[data-theme="light"] {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-input: #f1f5f9;
      --border-color: #e2e8f0;
      --border-focus: #4f46e5;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-primary: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.1);
      --google-bg: #ffffff;
      --facebook-bg: #1877F2;
      --shadow-card: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      right: 24px;
    }
    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-card);
      transition: border-color 0.2s;
    }
    .theme-toggle-btn:hover { border-color: var(--accent-primary); }

    .wrapper {
      width: 100%;
      max-width: 440px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-img {
      width: 52px;
      height: 52px;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 16px rgba(99, 102, 241, 0.4));
    }

    .logo-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .logo-sub {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 32px;
      box-shadow: var(--shadow-card);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    /* OAuth buttons */
    .oauth-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-oauth {
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-google {
      background: var(--google-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .btn-google:hover { border-color: var(--accent-primary); }

    .btn-facebook {
      background: var(--facebook-bg);
      color: #ffffff;
      border: none;
    }
    .btn-facebook:hover { opacity: 0.9; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    /* Forms */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent-primary); }

    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      background: var(--accent-primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      width: 100%;
      padding: 10px 16px;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-secondary:hover { border-color: var(--text-secondary); color: var(--text-primary); }

    .user-card {
      text-align: center;
    }

    .user-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-primary);
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .user-name { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }
    .user-email { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 20px; }

    .apps-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    .apps-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .apps-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .app-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: border-color 0.2s;
    }
    .app-link:hover { border-color: var(--accent-primary); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }

    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.83rem;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; }
    .alert-success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #10b981; }

    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 0.83rem;
      color: var(--text-secondary);
    }
    .footer-links a { color: var(--accent-primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="theme-toggle-btn" onclick="toggleTheme()">
      <span id="themeIcon">☀️</span> <span id="themeLabel">Light Mode</span>
    </button>
  </div>

  <div class="wrapper">
    <div class="logo-area">
      <img src="/vlnfi_sso_favicon_option_1.svg" alt="Logo" class="logo-img" />
      <div class="logo-title">vInfi SSO</div>
      <div class="logo-sub">Đăng nhập một lần, truy cập tất cả ứng dụng</div>
    </div>

    <div class="card">
      <div class="alert alert-error" id="alertError"></div>
      <div class="alert alert-success" id="alertSuccess"></div>

      <!-- Logged-In State -->
      <div class="user-card" id="userCard" style="display: none;">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-name" id="userName">—</div>
        <div class="user-email" id="userEmail">—</div>

        <a href="/ui/admin" id="adminBtn" class="btn-primary" style="display: none; margin-bottom: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); text-decoration: none; text-align: center;">
          🛡️ Trang Quản Trị (Admin Dashboard)
        </a>

        <button class="btn-secondary" onclick="logout()">Đăng xuất</button>
      </div>

      <!-- Login Form State -->
      <div id="loginSection">
        <div class="card-title">Đăng nhập</div>

        <div class="oauth-group">
          <a href="/sso/oauth/google" class="btn-oauth btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Tiếp tục với Google
          </a>
          <a href="/sso/oauth/facebook" class="btn-oauth btn-facebook">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Tiếp tục với Facebook
          </a>
        </div>

        <div class="divider">Hoặc bằng Email</div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="name@example.com" />
          </div>
          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn-primary" id="loginBtn">Đăng nhập</button>
        </form>
      </div>

      <div class="apps-section">
        <div class="apps-title">Ứng dụng kết nối</div>
        <div class="apps-grid">
          <a href="https://vunph.click/kinhdich" class="app-link">
            <span>☯️ IChingNow</span>
            <span class="dot"></span>
          </a>
          <a href="https://vunph.click/tarot" class="app-link">
            <span>🎴 TarotNow</span>
            <span class="dot"></span>
          </a>
        </div>
      </div>
    </div>

    <div class="footer-links">
      Chưa có tài khoản? <a href="/ui/register">Đăng ký ngay</a>
    </div>
  </div>

  <script>
    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('vinfi_theme', t);
      document.getElementById('themeIcon').textContent = t === 'dark' ? '☀️' : '🌙';
      document.getElementById('themeLabel').textContent = t === 'dark' ? 'Light Mode' : 'Dark Mode';
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      setTheme(cur === 'dark' ? 'light' : 'dark');
    }
    setTheme(localStorage.getItem('vinfi_theme') || 'dark');

    async function loadUser() {
      try {
        const token = localStorage.getItem('sso_token');
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        const res = await fetch('/sso/me', { headers, credentials: 'include' });
        const data = await res.json();
        if (data.token) {
          localStorage.setItem('sso_token', data.token);
        }
        if (data.user) {
          document.getElementById('loginSection').style.display = 'none';
          document.getElementById('userCard').style.display = 'block';
          document.getElementById('userName').textContent = data.user.displayName || data.user.email;
          document.getElementById('userEmail').textContent = data.user.email;
          document.getElementById('userAvatar').textContent = (data.user.displayName || data.user.email || 'A')[0].toUpperCase();
          if (data.user.role === 'admin') {
            document.getElementById('adminBtn').style.display = 'block';
          }
        }
      } catch (e) {}
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/sso/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (data.token) {
            localStorage.setItem('sso_token', data.token);
          }
          loadUser();
        } else {
          alert(data.message || 'Đăng nhập thất bại');
        }
      } catch (err) { alert('Lỗi kết nối'); }
    });

    async function logout() {
      const token = localStorage.getItem('sso_token');
      const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
      await fetch('/sso/logout', { method: 'POST', headers, credentials: 'include' });
      localStorage.removeItem('sso_token');
      location.reload();
    }

    loadUser();
  </script>
</body>
</html>
