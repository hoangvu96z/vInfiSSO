<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vInfi SSO — Đăng ký tài khoản</title>
  <link rel="icon" type="image/svg+xml" href="/vlnfi_sso_favicon_option_1.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root[data-theme="dark"] {
      --bg-page: #090d16;
      --bg-card: #131c31;
      --bg-input: #1a243d;
      --border-color: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }
    :root[data-theme="light"] {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-input: #f1f5f9;
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-primary: #4f46e5;
      --accent-hover: #4338ca;
      --shadow-card: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 0.3s ease;
    }
    .top-bar { position: absolute; top: 20px; right: 24px; }
    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .wrapper { width: 100%; max-width: 440px; }
    .logo-area { text-align: center; margin-bottom: 28px; }
    .logo-img { width: 52px; height: 52px; margin-bottom: 12px; }
    .logo-title { font-size: 1.6rem; font-weight: 800; }
    .logo-sub { font-size: 0.88rem; color: var(--text-secondary); margin-top: 4px; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 32px;
      box-shadow: var(--shadow-card);
    }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 0.9rem; outline: none;
    }
    input:focus { border-color: var(--accent-primary); }
    .btn-primary {
      width: 100%; padding: 12px 16px;
      background: var(--accent-primary);
      color: #ffffff; border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 700; cursor: pointer;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .footer-links { text-align: center; margin-top: 20px; font-size: 0.83rem; color: var(--text-secondary); }
    .footer-links a { color: var(--accent-primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="top-bar">
    <button class="theme-toggle-btn" onclick="toggleTheme()">
      <span id="themeIcon">☀️</span> <span id="themeLabel">Light Mode</span>
    </button>
  </div>

  <div class="wrapper">
    <div class="logo-area">
      <img src="/vlnfi_sso_favicon_option_1.svg" alt="Logo" class="logo-img" />
      <div class="logo-title">vInfi SSO</div>
      <div class="logo-sub">Tạo tài khoản SSO dùng chung cho tất cả hệ thống</div>
    </div>

    <div class="card">
      <div class="card-title">Đăng ký tài khoản</div>
      <form id="regForm">
        <div class="form-group">
          <label>Họ và tên / Hiển thị</label>
          <input type="text" id="displayName" required placeholder="Nguyễn Văn A" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="name@example.com" />
        </div>
        <div class="form-group">
          <label>Mật khẩu (Tối thiểu 8 ký tự)</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-primary">Đăng ký ngay</button>
      </form>
    </div>

    <div class="footer-links">
      Đã có tài khoản? <a href="/ui/sso">Đăng nhập ngay</a>
    </div>
  </div>

  <script>
    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('vinfi_theme', t);
      document.getElementById('themeIcon').textContent = t === 'dark' ? '☀️' : '🌙';
      document.getElementById('themeLabel').textContent = t === 'dark' ? 'Light Mode' : 'Dark Mode';
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      setTheme(cur === 'dark' ? 'light' : 'dark');
    }
    setTheme(localStorage.getItem('vinfi_theme') || 'dark');

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const displayName = document.getElementById('displayName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/sso/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName, email, password }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert('Đăng ký thành công! Vui lòng kiểm tra email để xác nhận.');
          window.location.href = '/ui/sso';
        } else {
          alert(data.message || 'Đăng ký thất bại');
        }
      } catch (err) { alert('Lỗi kết nối'); }
    });
  </script>
</body>
</html>
